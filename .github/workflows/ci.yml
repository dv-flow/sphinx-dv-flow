name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is pinned because `requires-python` claims it. A claim no
        # job checks is a claim that quietly stops being true.
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from tags.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ivpm
        run: pip install ivpm

      - name: Assemble the dev environment
        run: ivpm update -a

      - name: Run tests
        # No install step: ivpm's venv has no pip, and tests/conftest.py puts
        # `src` on the path (and on PYTHONPATH, for the subprocess probes).
        run: ./packages/python/bin/pytest -v

      - name: Build docs
        # -W because these docs are the acceptance test for the directives the
        # extension ships: a warning here means a directive is not finished.
        run: ./packages/python/bin/sphinx-build -W -b html docs docs/_build/html
