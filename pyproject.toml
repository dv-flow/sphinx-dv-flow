[build-system]
# No setuptools-scm. The version comes from `src/dv_flow/doc/__version__.py`,
# which is a file CI can stamp and a checkout can read without tags. scm derives
# it from `git describe`, which means a shallow clone, an exported tarball, or a
# repository whose tags have not been fetched all build a package silently
# versioned 0.1.dev1 -- and this repo's Forgejo origin and GitHub mirror do not
# necessarily carry the same tags.
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sphinx-dv-flow"
dynamic = ["version"]
description = "Sphinx support for documenting DV Flow workflows"
readme = "README.md"
# 3.10, not 3.9: dv-flow-mgr uses PEP 604 unions (`str | None`) in annotations
# that are evaluated at import time, so 3.9 fails on `import dv_flow.mgr`.
# Claiming a floor we cannot actually run on is worse than a higher floor.
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Matthew Ballance", email = "matt.ballance@gmail.com"},
]
# `sphinx` is a hard dependency of the distribution because the Sphinx
# extension is the point of it. It is deliberately NOT a dependency of the
# `dv_flow.doc` import graph -- see tests/unit/test_no_sphinx_import.py.
dependencies = [
    "dv-flow-mgr",
    "sphinx>=7",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Sphinx :: Extension",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Documentation :: Sphinx",
    "Topic :: Software Development :: Documentation",
]

[project.optional-dependencies]
graphviz = ["graphviz"]
# `myst-parser` is what makes `dvflow_doc_format = "markdown"` handle general
# Markdown. Without it the extension falls back to a deliberately small
# conversion, so this is an upgrade rather than a requirement -- which is why it
# is an extra and not a dependency.
markdown = ["myst-parser"]
test = ["pytest"]
docs = ["furo", "sphinxcontrib-mermaid"]

[project.scripts]
dvflow-doc = "dv_flow.doc.cli:main"

[tool.setuptools.dynamic]
version = {attr = "dv_flow.doc.__version__._pkg_version"}

[tool.setuptools.packages.find]
where = ["src"]
# `dv_flow` is an implicit namespace package shared with dv-flow-mgr, so it
# must not be listed and must never gain an __init__.py.
include = ["dv_flow.*", "sphinx_dv_flow*"]
