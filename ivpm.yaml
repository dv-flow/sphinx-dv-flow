package:
  name: sphinx-dv-flow

  # WITHOUT THIS LINE, `ivpm update -a` INSTALLS NOTHING AND SUCCEEDS.
  #
  # With no `-d` and no `default-dep-set`, ivpm falls back to the FIRST dep-set
  # in this file (ivpm/project_ops.py, `_getDepSet`) -- which was `use`, and
  # `use` is deliberately empty. The result was "Total packages: 0", a zero exit
  # status, no `packages/python` virtualenv, and the next step failing with
  # `./packages/python/bin/pytest: No such file or directory` (exit 127).
  #
  # It never showed up locally because a populated `packages/` already existed
  # from an explicit `-d dev`; only a clean checkout runs the default path.
  # `ivpm update -a` is also what docs/install.rst tells contributors to run, so
  # naming the default here fixes the documented command rather than just CI.
  default-dep-set: dev

  dep-sets:
  # Deliberately empty: this package's runtime requirements are declared in
  # pyproject.toml, and duplicating them here would be a second copy to drift.
  # It stays first in the file, so `default-dep-set` above is what keeps it from
  # being chosen by accident.
  - name: use
    deps: []

  - name: dev
    deps:
    - name: sphinx
      src: pypi
    - name: sphinxcontrib-mermaid
      src: pypi
    # The `markdown` extra, present here so CI runs the tests that need it.
    # Without it `tests/build/test_markdown.py` skipped the myst-enabled case
    # and the stdlib build took the fallback path -- so the PRIMARY
    # implementation of `dvflow_doc_format = "markdown"` was exercised only on
    # machines that happened to have myst installed for another reason. It is
    # an optional dependency of the distribution and a required one for a
    # complete test run; those are different questions.
    - name: myst-parser
      src: pypi
    - name: furo
      src: pypi
    - name: pytest
      src: pypi
    - name: dv-flow-mgr
      dep-set: default-dev
      url: https://github.com/dv-flow/dv-flow-mgr.git
