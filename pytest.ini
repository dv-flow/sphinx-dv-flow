[pytest]
testpaths = tests

# `build` is in pytest's DEFAULT norecursedirs, so `tests/build/` -- the whole
# Sphinx-build test layer -- was collected when named explicitly and silently
# skipped in a full run. Sixty-six tests passing on demand and never in CI is
# worse than no tests at all, because the green run says they ran.
#
# Overriding is safe here: `testpaths` limits collection to `tests/`, so
# dropping `build` from the list cannot pull in a top-level build-output
# directory. The rest of the default list is restated because setting this
# option replaces it rather than adding to it.
norecursedirs = *.egg .* _darcs CVS dist node_modules venv {arch} roots data golden
