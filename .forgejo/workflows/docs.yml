# Docs build for dv-flow/sphinx-dv-flow on Forgejo Actions.
#
# THIS IS THE ONLY THING THAT PUBLISHES THESE DOCS. dvkit.org owns all
# documentation for the estate: a repo's docs land at dvkit.org/<org>/<repo>/.
# dvkit.org is a single Cloudflare Pages project and a deploy replaces the WHOLE
# site, so there is exactly one publisher for it -- a per-repo GitHub Pages site
# is not a harmless second copy, it is a second publisher on a different
# schedule that drifts.
#
# The built HTML leaves as an ARTIFACT and nothing else. This job holds no
# Cloudflare token and mounts nothing: a workflow file is public and editable by
# anyone who can push, and the deploy credential is account-scoped. Everything
# after this point is host-side:
#
#   docs-fetch dv-flow/sphinx-dv-flow main   # artifact -> staging/
#   docs-promote / docs-deploy               # -> dvkit.org/dv-flow/sphinx-dv-flow/
#
# NOTE FOR WHOEVER RUNS THAT THE FIRST TIME: docs-fetch defaults to branch
# `master`; this repo's default branch is `main`, so it must be passed
# explicitly or the fetch finds no run.
#
# Constraints this file is shaped by, all measured on this instance:
#
#  1. No third-party actions. A bare `uses:` resolves against code.forgejo.org
#     (Forgejo's DEFAULT_ACTIONS_URL), not github.com, so actions/setup-python
#     does not exist here. `ubuntu-latest` maps to catthehacker/ubuntu:act-22.04.
#  2. `python` unqualified DOES NOT EXIST in that image. Use python3.
#  3. That image carries Python 3.10, which is exactly this project's floor
#     (`requires-python = ">=3.10"`, because dv-flow-mgr evaluates PEP 604
#     annotations at import time). There is no margin here: raising the floor
#     without raising the image breaks this job, not just a matrix leg.
#  4. The artifact name is the `docs-<org>-<repo>` convention docs-fetch matches
#     on, and `path: .../**` makes the build directory the ZIP ROOT --
#     docs-fetch refuses an artifact with no index.html at the top level.

name: Docs

on:
  - push
  - pull_request
  - workflow_dispatch

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Check for internal identifiers in tracked files
        # This repo is published to git.dvkit.org and mirrored to GitHub, so
        # anything committed here is public. Internal host names, tailnet
        # addresses and CGNAT-range IPs must not appear in tracked files -- if a
        # build ever needs one, it belongs in a repository secret, which is
        # masked in logs.
        #
        # The pathspec excludes the whole .forgejo/workflows directory, not just
        # this file. Excluding only itself is what made four edapack repos red
        # for a day: with two workflows present, each matched the OTHER's copy
        # of this very pattern.
        run: |
          pattern='perch-char\.ts\.net|\.ts\.net|a9550|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]+\.[0-9]+'
          if git grep -nIE "$pattern" -- . ':!.forgejo/workflows/' ; then
            echo "::error::internal identifier found in a tracked file (see matches above)"
            exit 1
          fi
          echo "OK: no internal identifiers in tracked files"

      - name: Report the environment
        # Cheap, and it turns "the job failed and I cannot see why" into a fact.
        run: |
          echo "python: $(python3 -V 2>&1)  at $(command -v python3)"
          echo "pwd:    $(pwd)"
          echo "runner: ${RUNNER_OS:-unknown} ${RUNNER_ARCH:-}"

      - name: Install ivpm
        # WHY THIS GOES THROUGH IVPM AT ALL, unlike psstools/pssunit, whose docs
        # need nothing but Sphinx.
        #
        # docs/conf.py loads `sphinx_dv_flow`, which imports `dv_flow.mgr` and
        # reads real flow files through the engine's own loader -- the extension
        # documents itself, deliberately, so a change that breaks it breaks its
        # own docs build. A bare `pip install Sphinx` here produces an immediate
        # ImportError, not a quietly empty document.
        #
        # ivpm also installs this project itself as an editable package, which
        # is what puts `sphinx_dv_flow` on the path for sphinx-build. Note that
        # the runner's pip predates PEP 660, so a manual `pip install -e .` on a
        # pyproject-only project fails here with "build backend is missing the
        # build_editable hook"; ivpm's own venv has a current pip and does not
        # hit that.
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ivpm

      - name: Configure ivpm dependency resolution
        # ivpm.yaml names github.com for dv-flow-mgr. Remap it so a docs build
        # on this forge does not depend on GitHub being reachable -- the whole
        # point of the mirror is that it is the source of truth here. The
        # fvutils entry is for dv-flow-mgr's own dependency on svdep; both were
        # confirmed present on git.dvkit.org before this landed.
        run: |
          mkdir -p ~/.config/ivpm
          cat > ~/.config/ivpm/config.yaml <<'EOF'
          git-url-map:
            - from: "https://github.com/dv-flow/"
              to:   "https://git.dvkit.org/dv-flow/"
            - from: "https://github.com/fvutils/"
              to:   "https://git.dvkit.org/fvutils/"
          git-auth:
            - host: "git.dvkit.org"
              order: ["https"]
          EOF

      - name: Assemble the dev environment
        # The dep-set comes from `default-dep-set:` in ivpm.yaml. Stating it
        # here as well would let the documented bare command break with nothing
        # able to notice -- see the comment in ivpm.yaml for the failure this
        # replaced, which was `ivpm update -a` installing nothing and exiting 0.
        run: |
          python3 -m ivpm update -j 1 -a
          if [ ! -x packages/python/bin/sphinx-build ]; then
            echo "::error::ivpm update produced no packages/python/bin/sphinx-build."
            echo "Resolved packages:"
            ls -1 packages/ || true
            exit 1
          fi

      - name: Build HTML docs
        # -W, the same as the GitHub CI job. These docs are the acceptance test
        # for the directives the extension ships: a warning here means a
        # directive is not finished, and publishing that is worse than not
        # publishing.
        run: |
          ./packages/python/bin/sphinx-build -W -b html docs docs/_build/html

      - name: Sanity-check the build
        # Sphinx exits 0 on a build that produced almost nothing, and an empty
        # doc set is worse than a failed one BECAUSE IT DEPLOYS. Auto-promote
        # means no human stands between this artifact and dvkit.org for a push
        # to the default branch, so these checks are what stands in place of the
        # review gate.
        run: |
          test -s docs/_build/html/index.html \
            || { echo "::error::no index.html in the build output"; exit 1; }

          n=$(find docs/_build/html -name '*.html' | wc -l)
          echo "generated pages: $n"
          # A local build produced 26 pages on 2026-09-03, verified identical
          # from a clean checkout. The floor is 22: enough headroom that a
          # normal edit does not trip it, low enough that a real page dropping
          # out takes the count below it. KEEP RAISING THIS as pages are added;
          # a floor that never moves stops being a check and becomes decoration.
          [ "$n" -ge 22 ] || { echo "::error::only $n pages built; a known-good build of this doc set produces 26. Refusing to call this a doc set."; exit 1; }

          # The generated reference is the thing this extension exists to
          # produce, and it is exactly what fails silently: a directive that
          # resolves nothing still renders a page, with a heading and no
          # content. Page count cannot see that, so check for rendered objects.
          for page in reference/directives reference/roles; do
            test -s "docs/_build/html/${page}.html" \
              || { echo "::error::${page}.html missing or empty"; exit 1; }
          done
          if ! grep -q 'dvf-tasks' docs/_build/html/genindex.html \
             && ! test -s docs/_build/html/dvf-tasks.html; then
            echo "::error::the task index rendered nothing; the domain registered no objects"
            exit 1
          fi
          echo "OK: $n pages, indices present"

      - name: Upload docs
        # Consumed by the host-side poller:
        #   docs-fetch dv-flow/sphinx-dv-flow main
        uses: forgejo/upload-artifact@v4
        with:
          name: docs-dv-flow-sphinx-dv-flow
          path: docs/_build/html/**
          if-no-files-found: error
